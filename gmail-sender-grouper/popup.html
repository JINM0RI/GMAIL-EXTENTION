<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail Sender Grouper</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 300px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(180deg, #f9fbff 0%, #f0f4ff 100%);
        color: #0f172a;
      }

      .card {
        border-radius: 12px;
        border: 1px solid #dbeafe;
        background: #ffffff;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        padding: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
        color: #334155;
      }

      .meta {
        margin-top: 10px;
        font-size: 12px;
        color: #475569;
      }

      button {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        font-size: 13px;
        padding: 10px 12px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Gmail Sender Grouper</h1>
      <p>
        Groups visible inbox emails by sender with live updates, quick search, and
        sender statistics.
      </p>
      <p class="meta" id="status">Ready</p>
      <button id="openGmailBtn" type="button">Open Gmail</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
